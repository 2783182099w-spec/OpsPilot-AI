x-backend: &backend
  image: opspilot-api:local
  build:
    context: ./opspilot_api
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  env_file: .env
  environment:
    PROMETHEUS_URL: http://prometheus:9090
    MONITOR_CONFIG_DIR: /app/monitor
  volumes:
    - data:/app/data
    - monitor_config:/app/monitor
    - ./known_hosts:/app/known_hosts:ro
  logging: &logging
    options: {max-size: "10m", max-file: "3"}

services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  init:
    <<: *backend
    volumes:
      - data:/app/data
      - monitor_config:/app/monitor
      - monitor_data:/prometheus-data
    command: ["/bin/sh", "-ec", "python manage.py migrate --noinput && python manage.py shell -c 'from monitoring.configuration import defaults, write_config; defaults(); write_config()'"]
  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/home/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "manage.py", "taskworker"]
    depends_on:
      init: {condition: service_completed_successfully}
  prometheus:
    image: ${PROMETHEUS_IMAGE:-quay.io/prometheus/prometheus:v3.5.1}
    user: "1000:1000"
    restart: unless-stopped
    logging: *logging
    command: ["--config.file=/app/monitor/prometheus.yml", "--storage.tsdb.path=/data", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB", "--query.max-concurrency=4", "--query.timeout=8s", "--web.enable-lifecycle"]
    volumes:
      - monitor_config:/app/monitor:ro
      - monitor_data:/data
    depends_on:
      init: {condition: service_completed_successfully}
  monitor:
    <<: *backend
    restart: unless-stopped
    command: ["python", "manage.py", "monitorworker"]
    depends_on:
      init: {condition: service_completed_successfully}
      prometheus: {condition: service_started}
  web:
    build:
      context: ./opspilot_web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    logging: *logging
    ports: ["127.0.0.1:${OPSPILOT_WEB_PORT:-9000}:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  data:
  monitor_config:
  monitor_data:
