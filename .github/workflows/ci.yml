name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: opspilot_api.settings.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r opspilot_api/requirements-modern.txt
      - run: mkdir -p opspilot_api/logs
      - run: python manage.py test host mtask ai
        working-directory: opspilot_api
      - run: python manage.py makemigrations --check --dry-run
        working-directory: opspilot_api
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: opspilot_web
      - run: pnpm run build
        working-directory: opspilot_web
